services:
  taskly-frontend:
    build:
      context: ../taskly-frontend
      dockerfile: ../taskly-docker/taskly-frontend/Dockerfile
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-http://localhost:8080/api/v1}"
        VITE_SERVER_BASE_URL: "${VITE_SERVER_BASE_URL:-http://localhost:8080}"
    image: taskly-frontend:local
    container_name: taskly-frontend
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/ping"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
