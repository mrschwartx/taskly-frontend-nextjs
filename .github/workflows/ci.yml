name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  taskly-quality:
    name: taskly code quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: taskly-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: taskly-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run test:coverage
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: taskly-frontend/coverage
          retention-days: 7

  taskly-build:
    name: taskly code build
    runs-on: ubuntu-latest
    needs: taskly-quality
    timeout-minutes: 15
    defaults:
      run:
        working-directory: taskly-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: taskly-frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: |
            taskly-frontend/.next
            !taskly-frontend/.next/cache
          include-hidden-files: true
          retention-days: 1

  taskly-e2e-browser:
    name: tasky e2e browser
    runs-on: ubuntu-latest
    needs: taskly-build
    timeout-minutes: 20
    defaults:
      run:
        working-directory: taskly-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: taskly-frontend/package-lock.json
      - run: npm ci
      - run: npm run test:e2e:install
      - run: npm run test:e2e
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: taskly-frontend/playwright-report
          retention-days: 7

  taskly-docker:
    name: taskly docker container
    runs-on: ubuntu-latest
    needs: taskly-e2e-browser
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: taskly-frontend
          file: taskly-docker/taskly-frontend/Dockerfile
          load: true
          tags: taskly-frontend:ci
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=http://localhost:8080/api/v1
            NEXT_PUBLIC_SERVER_BASE_URL=http://localhost:8080
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run container
        run: docker run -d --name taskly-frontend -p 3000:3000 taskly-frontend:ci
      - name: Wait for health check
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/ping | grep -q OK; then
              exit 0
            fi
            sleep 2
          done
          docker logs taskly-frontend
          exit 1
      - name: Check pages
        run: |
          for path in / /signup /signin /profile /tasks /create-task /tasks/sample /update-task/sample; do
            curl -fsS http://localhost:3000$path | grep -q '<title>Taskly</title>'
          done
      - name: Show logs on failure
        if: failure()
        run: docker logs taskly-frontend
