name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Taskly commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .commitlintrc.json

  taskly-quality:
    name: Taskly code quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: taskly-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: taskly-frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests
        run: npm run test:integration
      - name: Testing coverage
        run: npm run test:coverage
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: taskly-frontend/coverage
          retention-days: 7

  taskly-build:
    name: Taskly build
    runs-on: ubuntu-latest
    needs: taskly-quality
    timeout-minutes: 15
    defaults:
      run:
        working-directory: taskly-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: taskly-frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: taskly-frontend/dist
          retention-days: 1

  taskly-e2e-browser:
    name: Taskly end-to-end browser
    runs-on: ubuntu-latest
    needs: taskly-build
    timeout-minutes: 20
    defaults:
      run:
        working-directory: taskly-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: taskly-frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Install browser
        run: npm run test:e2e:install
      - name: Run browser tests
        run: npm run test:e2e
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: taskly-frontend/playwright-report
          retention-days: 7

  taskly-docker:
    name: Taskly docker container
    runs-on: ubuntu-latest
    needs: taskly-build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: taskly-frontend
          file: taskly-docker/taskly-frontend/Dockerfile
          load: true
          tags: taskly-frontend:ci
          build-args: |
            VITE_API_BASE_URL=http://localhost:8080/api/v1
            VITE_SERVER_BASE_URL=http://localhost:8080
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run container
        run: docker run -d --name taskly-frontend -p 3000:3000 taskly-frontend:ci
      - name: Wait for health check
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/ping | grep -q OK; then
              exit 0
            fi
            sleep 2
          done
          docker logs taskly-frontend
          exit 1
      - name: Check pages
        run: |
          for path in / /signup /signin /profile /tasks /create-task /tasks/sample /update-task/sample; do
            curl -fsS http://localhost:3000$path | grep -q '<div id="root">'
          done
      - name: Show logs on failure
        if: failure()
        run: docker logs taskly-frontend
